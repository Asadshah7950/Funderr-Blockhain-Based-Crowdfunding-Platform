name: Smart Contracts CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/blockchain/**'
      - '.github/workflows/smart-contracts.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/blockchain/**'
      - '.github/workflows/smart-contracts.yml'

jobs:
  test-contracts:
    name: Compile & Test Hardhat Contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Solidity contracts
        run: npx hardhat compile

      - name: Run Hardhat test suite (33 tests)
        run: npx hardhat test
